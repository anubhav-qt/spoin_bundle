<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }
    a { color: var(--accent); } a:hover { color: var(--accent-2); }

    .stage {
      --bg:#edf0ea; --bg-2:#e2e7de; --bg-3:#d6ddd1;
      --fg:#262a22; --fg-2:#565f51; --fg-3:#838c7d;
      --accent:#c1442b; --accent-2:#a83a24; --line:rgba(38,42,34,0.14);
      width: 380px; height: 220px;
      background: var(--bg); color: var(--fg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    }
    [data-palette="twilight"] .stage { --bg:#12141a; --bg-2:#191c24; --bg-3:#22262f; --fg:#e8eaf0; --fg-2:#a8adba; --fg-3:#6e7484; --accent:#7c9eff; --accent-2:#ff9d7c; --line:rgba(232,234,240,0.12); }
    [data-palette="cyanotype"] .stage { --bg:#e8f0f7; --bg-2:#dce8f2; --bg-3:#cddfec; --fg:#1e3448; --fg-2:#4c6478; --fg-3:#7891a3; --accent:#3f7ea3; --accent-2:#2f6486; --line:rgba(30,52,72,0.12); }
    [data-palette="phosphor"] .stage { --bg:#0b0b0c; --bg-2:#141415; --bg-3:#1e1e1f; --fg:#e6e6e7; --fg-2:#a3a3a5; --fg-3:#6c6c6f; --accent:#f4f4f5; --accent-2:#d4d4d6; --line:rgba(230,230,231,0.12); }
    [data-palette="scope"] .stage { --bg:#0d1116; --bg-2:#141b22; --bg-3:#1c2730; --fg:#e3ecf2; --fg-2:#98adbb; --fg-3:#5e7180; --accent:#38c6d9; --accent-2:#e8a33d; --line:rgba(227,236,242,0.12); }

    .caption { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-3); text-align: center; line-height: 1.6; }
    .caption b { color: var(--fg-2); }

    /* ---- WAVE: each glyph lifts on a staggered sine, a ripple running
            s -> n. The o rides highest, in accent. ---- */
    .loader { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; display: inline-flex; }
    .loader b { display: inline-block; font-weight: 700; animation: wave 1.15s ease-in-out infinite; }
    .loader b:nth-child(1) { animation-delay: 0s; }
    .loader b:nth-child(2) { animation-delay: .08s; }
    .loader b:nth-child(3) { animation-delay: .16s; color: var(--accent); }
    .loader b:nth-child(4) { animation-delay: .24s; }
    .loader b:nth-child(5) { animation-delay: .32s; }
    @keyframes wave { 0%, 62%, 100% { transform: translateY(0); } 28% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      .loader b { animation: none; transform: none; }
      .loader b:nth-child(3) { transform: scale(1.14); }
    }
  </style>
</helmet>
<div data-palette="{{palette}}">
  <div class="stage">
    <div class="loader" role="img" aria-label="Loading"><b>s</b><b>p</b><b>o</b><b>i</b><b>n</b></div>
    <div class="caption">Wave &middot; <b>a ripple runs through the letters</b><br>reduced motion &rarr; rest, o held slightly larger</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"palette":{"editor":"enum","default":"notebook","options":["notebook","twilight","cyanotype","phosphor","scope"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { palette: this.props.palette ?? "notebook" };
  }
}
</script>
</body>
</html>
