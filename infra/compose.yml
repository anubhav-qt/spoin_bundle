# The Hono stack (ADR-0106). Its OWN project and its OWN volume: nothing here can reach
# the old `spoin` project's `db-data`, which holds spoin_db_2. Host ports are offset
# (5434, 8001) so both stacks can run side by side.
#
#   npm run stack        build and start (the web on 3001, the API on 8001)
#   npm run stack:down   stop (the volume is kept)
#
# Never `docker compose down -v` here either: it is cheap today, it won't be once the
# tadpoles have written a universe into it.
name: spoin-hono

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: spoin
      POSTGRES_PASSWORD: spoin
      POSTGRES_DB: spoin
    ports:
      - "5434:5432"
    volumes:
      - hono-db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-universe.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoin -d spoin"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Gemini through the owner's Antigravity sign-ins (task 0045). The auth files are copies of
  # Trotter's, in the gitignored .cliproxy/auths; the keys are in the gitignored infra/.env, and
  # nothing starts without them. 8317 on the host is Trotter's own proxy.
  cliproxy:
    build: ./cliproxy
    restart: unless-stopped
    environment:
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY:?Set CLIPROXY_API_KEY in infra/.env}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?Set CLIPROXY_MANAGEMENT_KEY in infra/.env}
    ports:
      - "127.0.0.1:8318:8317"
    volumes:
      - ./.cliproxy/auths:/app/auths
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"Authorization: Bearer $$CLIPROXY_API_KEY\" http://127.0.0.1:8317/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment: &server-env
      NODE_ENV: development
      DATABASE_URL: postgres://spoin:spoin@db:5432/spoin
      UNIVERSE_DATABASE_URL: postgres://spoin:spoin@db:5432/the_spoin_universe
      AUTH_SECRET: spoin-local-development-secret-change-me
      ALLOWED_ORIGINS: http://localhost:3001
      PUBLIC_URL: http://localhost:8001
      EMBEDDER: ${EMBEDDER:-hash}
      MODEL_CACHE_DIR: /models
      DEV_ROUTES: "true"
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    restart: unless-stopped
    environment: *server-env
    ports:
      - "8001:8000"
    volumes:
      - hono-models:/models
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      # The browser resolves this, not the container, so it is the host's port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Windows bind mounts deliver no file events; poll for them.
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3000"
    # The sources only: the image's node_modules and .next stay the container's own.
    volumes:
      - ../apps/web/app:/app/apps/web/app
      - ../apps/web/components:/app/apps/web/components
      - ../apps/web/lib:/app/apps/web/lib
      - ../apps/web/public:/app/apps/web/public
      - ../packages/shared/src:/app/packages/shared/src
    depends_on: [api]

volumes:
  hono-db:
  hono-models:
