# spoin's own SearXNG (task 0045): Google only, as JSON for the agents' web_search. It is ours
# alone, reached only from this machine, so the limiter that guards public instances is off. The
# secret key comes from SEARXNG_SECRET in the gitignored infra/.env.
use_default_settings:
  engines:
    keep_only:
      - google

server:
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
