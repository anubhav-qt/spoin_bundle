[project]
name = "spoin"
version = "0.1.0"
description = "Spoin API and workers — one codebase, two entrypoints"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "procrastinate>=2.10",
    "bcrypt>=4.0",
    "PyJWT[crypto]>=2.8",
    "google-auth>=2.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# Local embeddings (hard rule 5). Split out because onnxruntime is a large wheel
# and the default `hash` embedder keeps `docker compose up` inside the 10-minute
# promise. Install this before doing anything where similarity has to mean something.
embeddings = [
    "fastembed>=0.4",
]

# ADR-0002: langchain is a dependency of exactly one module. Keeping it optional
# makes the boundary physical rather than merely conventional — a stray import
# outside src/spoin/generation/langchain_impl.py fails to resolve at all in the
# default install, before the CI lint rule ever has to catch it.
#
# ADR-0024: langgraph joins this extra for the same reason, confined to
# src/spoin/generation/pipeline.py instead — it orchestrates ONE job's control
# flow (curriculum -> per-subtopic generation -> gate), never scheduling or
# cross-run retry, which stays the worker/GenerationJob's job.
generation = [
    "langchain-core>=0.3",
    # Capped, not just floored: 4.x is confirmed to depend on the `google-genai`
    # SDK (`google.genai.errors.ClientError`, langchain_impl.py's real-429
    # detection) rather than the older `google-generativeai`/`google-api-core`
    # stack 2.x/3.x used. An unpinned upper bound let a plain rebuild silently
    # jump SDKs and break that import with no code change on our side (2026-08-18)
    # -- re-verify langchain_impl.py's error handling before raising this cap.
    "langchain-google-genai>=4.0,<5.0",
    "langgraph>=0.6",
    # ADR-0090: Mistral is called over raw `httpx`, not `langchain-mistralai` -- the
    # committed probe already exercised this exact request shape 646 times, and a
    # LangChain client would mean a new dependency AND a new ADR-0002 banned-api
    # entry to wrap it. In `generation` rather than the base dependencies because
    # only generation calls it; the deployed backend does not (ADR-0094).
    "httpx>=0.27",
]

# Task 0016 / ADR-0048: CockroachDB viability spike. Kept as its own extra --
# not in the default install -- while the spike answers whether the stack runs
# on CockroachDB at all. `sqlalchemy-cockroachdb` 2.0.4 hard-pins
# `SQLAlchemy<2.1,>=2.0.47`; adopting the dialect therefore caps SQLAlchemy at
# <2.1 (we currently floor at >=2.0.36 with no ceiling). The driver stays
# asyncpg -- the dialect does not bundle one.
cockroachdb = [
    "sqlalchemy-cockroachdb>=2.0.4,<2.1",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Capped, not just floored. `ruff>=0.8` alone meant a plain image rebuild could
    # pull a newer formatter whose output differs from whatever last formatted the
    # tree -- so `make lint` failed on three untouched files the first time ADR-0087
    # forced a rebuild (2026-09-04). A formatter is a moving target by design; a
    # rebuild should not be a formatting event. Raise this deliberately, with a
    # `ruff format` pass in the same commit.
    "ruff>=0.16.6,<0.17",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spoin = ["fixtures/*.json", "content/ascii_library_data/*.txt", "py.typed"]

# ------------------------------------------------------------------- ruff -----
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "TID", "ASYNC"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
]

# ADR-0002, enforced rather than documented: nothing outside
# src/spoin/generation/langchain_impl.py may import langchain.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain".msg = "Only src/spoin/generation/langchain_impl.py may import langchain (ADR-0002)."
"langchain_core".msg = "Only src/spoin/generation/langchain_impl.py may import langchain (ADR-0002)."
"langchain_google_genai".msg = "Only src/spoin/generation/langchain_impl.py may import langchain (ADR-0002)."
"langgraph".msg = "Only generation/pipeline/graph.py and nodes.py may import langgraph (ADR-0024)."

[tool.ruff.lint.per-file-ignores]
"src/spoin/generation/langchain_impl.py" = ["TID251"]
# pipeline is a package now. Listed file by file rather than globbed: ADR-0024
# confines langgraph, and only these two actually touch it -- graph.py builds
# the StateGraph, nodes.py returns Send/Command. A package-wide ignore would
# quietly let it spread to the other four.
"src/spoin/generation/pipeline/graph.py" = ["TID251"]
"src/spoin/generation/pipeline/nodes.py" = ["TID251"]
# Mocks ChatGoogleGenerativeAI directly — doesn't touch the real API, and
# tests/test_architecture.py's AST-level check only scans src/spoin, not this
# file, so the real architectural boundary is unaffected by this exemption.
"tests/test_langchain_impl.py" = ["TID251"]
"tests/*" = ["E501"]

# ------------------------------------------------------------------- mypy -----
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "procrastinate.*", "bcrypt.*", "psutil.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------- pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
