[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# The URL is read from SPOIN_UNIVERSE_DATABASE_URL in alembic/env.py -- and from
# nothing else. ADR-0088: this environment structurally cannot reach spoin_db_2.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
