# The enforcement half of every "hard rule" in docs/architecture/overview.md.
#
# README.md and tests/test_architecture.py both claimed CI ran these checks on
# every PR; nothing did. That mattered more here than it would in most repos,
# because this codebase deliberately encodes its architecture as *tests* rather
# than as prose — the LLM-free feed read path, the one-module LangChain
# boundary, batch-only LLM interfaces, difficulty-mix-is-config. Those are only
# guarantees if something runs them.
#
# Mirrors `make check` (lint -> types -> test). The one difference is Postgres:
# locally that is docker-compose's `db` service, here it is a service container
# on the same pgvector image, so the extension and the version match.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      db:
        # Same image as docker-compose.yml's `db`, so pgvector is present and
        # the server version matches what developers run locally.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: spoin
          POSTGRES_PASSWORD: spoin
          POSTGRES_DB: spoin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spoin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's base image and pyproject's target-version.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        # Same extras the Dockerfile installs. `generation` is required for the
        # tests that exercise langchain_impl and the pipeline; `embeddings`
        # pulls onnxruntime, which those tests do not need — the hash embedder
        # is the default (see embeddings/__init__.py) — so it is left out to
        # keep CI fast.
        run: pip install -e ".[dev,generation]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Types (mypy --strict)
        run: mypy src

      - name: Create test database
        run: |
          PGPASSWORD=spoin psql -h localhost -U spoin -d spoin_db \
            -c "CREATE DATABASE spoin_db_test" || true

      - name: Tests
        env:
          # conftest.py refuses any database whose name does not end in `_test`,
          # and deliberately does NOT fall back to SPOIN_DATABASE_URL — it drops
          # and recreates every table it touches.
          SPOIN_TEST_DATABASE_URL: postgresql+asyncpg://spoin:spoin@localhost:5432/spoin_db_test
          SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@localhost:5432/spoin_db
        run: pytest -q

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Types (tsc --noEmit)
        run: npm run typecheck

      - name: Build
        run: npm run build
