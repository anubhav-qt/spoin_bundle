# One command brings up the whole stack:
#
#     docker compose up
#
# Services:
#   db      Postgres 17 + pgvector          (Neon in production)
#   seed    runs migrations only, then exits -- see the note on `spoin_db`
#           below. NOT "+ loads fixtures" anymore (see CLAUDE.md).
#   api     FastAPI                          http://localhost:8000/docs
#   web     Next.js                          http://localhost:3000
#   worker  polls for pending GenerationJob rows every few seconds (--watch)
#           so a topic typed into the app locally actually gets generated.
#           Production runs the same code once per cron invocation instead
#           (worker/README.md, ADR-0003 §3) -- this always-on loop is a
#           local-dev convenience, not how it deploys.
#
# `spoin_db` (the `db` service's database) is the ONE dev database this
# project uses -- no seed fixtures, blank until the app itself writes to it.
# See CLAUDE.md's "Working in this repo": nothing may reset, reseed, migrate-
# experiment on, or otherwise mutate its data without the user's explicit
# approval first, agent sessions included.

name: spoin

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: spoin
      POSTGRES_PASSWORD: spoin
      POSTGRES_DB: spoin_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoin -d spoin_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations only -- no fixture loading (see the `spoin_db` note above).
  # Its own service rather than the API's entrypoint regardless: an API
  # container that migrates on boot races itself the moment there is more
  # than one replica.
  seed:
    build:
      context: ./apps/api
    environment:
      SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db
    depends_on:
      db:
        condition: service_healthy
    # Mounted so `make migration` writes the generated file to the host rather than
    # into a container that is then thrown away.
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
    command: ["sh", "-c", "alembic upgrade head"]

  api:
    build:
      context: ./apps/api
    environment:
      SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db
      SPOIN_ENV: local
      SPOIN_CORS_ORIGINS: http://localhost:3000
      SPOIN_JWT_SECRET_KEY: dev-secret-not-for-prod
      # From the root .env (docker compose auto-loads it for ${...} substitution
      # in this file -- it does NOT inject the whole file into containers on its
      # own, only vars explicitly referenced here, which is why this and the
      # `worker` service below need it spelled out even though `.env` already
      # has it). Defaults to `fake` so a fresh clone with no `.env` still meets
      # the "docker compose up, no API key needed" promise. The API needs the
      # real generator too, not just the worker -- `request_topic`'s
      # `validate_topic_names`/`match_and_create_topics` calls run inline in
      # the request, before any GenerationJob exists for the worker to pick up.
      SPOIN_GENERATOR: ${SPOIN_GENERATOR:-fake}
      SPOIN_GEMINI_API_KEYS: ${SPOIN_GEMINI_API_KEYS:-}
      SPOIN_GEMINI_THINKING_LADDER: ${SPOIN_GEMINI_THINKING_LADDER:-gemini-3.7-flash:20:5,gemini-3.6-flash:20:5,gemini-3.5-flash:20:5,gemini-3-flash-preview:20:5}
      SPOIN_GEMINI_GENERATOR_LADDER: ${SPOIN_GEMINI_GENERATOR_LADDER:-gemini-3.5-flash-lite:500:15,gemini-3.1-flash-lite:500:15}
      SPOIN_MAX_CONCURRENT_GENERATION_CALLS: ${SPOIN_MAX_CONCURRENT_GENERATION_CALLS:-5}
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/src
      # Mounted so `make lint` / `make types` see the working tree rather than
      # whatever was baked into the image at build time.
      - ./apps/api/tests:/app/tests
      # And so do their *settings*. src/ and tests/ were mounted but
      # pyproject.toml was not, so ruff and mypy read the config baked in at
      # the last `docker compose build` -- editing a per-file-ignore or a
      # banned-api rule appeared to do nothing, and the stale rule kept firing
      # with its old message. Read-only: nothing in the container writes it.
      - ./apps/api/pyproject.toml:/app/pyproject.toml:ro
    command:
      ["uvicorn", "spoin.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ./apps/web
    environment:
      # The browser resolves this, not the container, so it is localhost either way.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Empty by default -- renders a disabled Google button rather than a
      # broken one. Set to match SPOIN_GOOGLE_CLIENT_ID above.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${SPOIN_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    command: ["npm", "run", "dev"]

  # Its own database, because the test fixtures drop and recreate every table.
  # Sharing `spoin_db` would silently wipe it every time anyone ran the suite
  # -- and `spoin_db` is the one dev database this project keeps (see the
  # note at the top of this file), so that's never acceptable, not even for
  # tests.
  test:
    profiles: ["test"]
    build:
      context: ./apps/api
    environment:
      SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db
      SPOIN_TEST_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      # pytest reads [tool.pytest.ini_options] from here -- same staleness
      # trap as the api service above.
      - ./apps/api/pyproject.toml:/app/pyproject.toml:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        python - <<'PY'
        import asyncio, asyncpg
        async def main():
            conn = await asyncpg.connect("postgresql://spoin:spoin@db:5432/spoin_db")
            try:
                await conn.execute("CREATE DATABASE spoin_db_test")
            except asyncpg.DuplicateDatabaseError:
                pass
            await conn.close()
        asyncio.run(main())
        PY
        pytest -q "$@"

  # Always-on here (local dev only) so a topic typed into the app actually
  # gets generated -- `--watch` polls for pending GenerationJob rows every
  # `SPOIN_WORKER_POLL_SECONDS` instead of the single cron pass production
  # uses (ADR-0003 §3: at free-tier quota a persistent pool has nothing to do
  # 99% of the time in PRODUCTION, which is not the same constraint as "does
  # a developer want to wait or manually rerun a one-shot command locally").
  # For the cron-shaped single pass this mirrors:
  #     docker compose run --rm worker python -m spoin.worker
  worker:
    build:
      context: ./apps/api
    environment:
      SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db
      # See the `api` service's identical two lines above for why this reads
      # from `.env` via `${...}` instead of a literal -- same reasoning here.
      SPOIN_GENERATOR: ${SPOIN_GENERATOR:-fake}
      SPOIN_GEMINI_API_KEYS: ${SPOIN_GEMINI_API_KEYS:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/src
    command: ["python", "-m", "spoin.worker", "--watch"]

volumes:
  db-data:
  web-node-modules:
