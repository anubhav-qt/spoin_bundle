# One command brings up the whole stack:
#
#     docker compose up
#
# Services:
#   db      Postgres 17 + pgvector          (Neon in production)
#   seed    runs migrations only, then exits -- see the note on `spoin_db`
#           below. NOT "+ loads fixtures" anymore (see CLAUDE.md).
#   api     FastAPI                          http://localhost:8000/docs
#   web     Next.js                          http://localhost:3000
#   worker  polls for pending GenerationJob rows every few seconds (--watch)
#           so a topic typed into the app locally actually gets generated.
#           Production runs the same code once per cron invocation instead
#           (worker/README.md, ADR-0003 §3) -- this always-on loop is a
#           local-dev convenience, not how it deploys.
#
# `spoin_db` (the `db` service's database) is the ONE dev database this
# project uses -- no seed fixtures, blank until the app itself writes to it.
# See CLAUDE.md's "Working in this repo": nothing may reset, reseed, migrate-
# experiment on, or otherwise mutate its data without the user's explicit
# approval first, agent sessions included.

name: spoin

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: spoin
      POSTGRES_PASSWORD: spoin
      POSTGRES_DB: spoin_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoin -d spoin_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations only -- no fixture loading (see the `spoin_db` note above).
  # Its own service rather than the API's entrypoint regardless: an API
  # container that migrates on boot races itself the moment there is more
  # than one replica.
  seed:
    # ADR-0087: context is the repo root, not ./apps/api -- the image needs
    # the sibling package apps/frog, which a context rooted at apps/api
    # cannot reach. Same for the api, test and worker services below.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SPOIN_DATABASE_URL: ${SPOIN_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/spoin_db_2}
      # ADR-0088: `the_spoin_universe` is a SEPARATE database, and this is a
      # separate variable on purpose -- frog will not fall back to
      # SPOIN_DATABASE_URL, because a convenience fallback is how a corpus
      # migration lands on spoin_db_2.
      SPOIN_UNIVERSE_DATABASE_URL: ${SPOIN_UNIVERSE_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe}

    depends_on:
      db:
        condition: service_healthy
    # Mounted so `make migration` writes the generated file to the host rather than
    # into a container that is then thrown away.
    volumes:
      - ./apps/api/src:/app/src
      # Same staleness reasoning as ./apps/api/src above, for the sibling
      # package (ADR-0087).
      - ./apps/frog/src:/app/frog/src
      - ./apps/api/alembic:/app/alembic
    command: ["sh", "-c", "alembic upgrade head"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # The request path embeds (ADR-0077's off-topic gate), so this image needs the
        # model -- on CPU, which is what ADR-0092 sized 0.6B for.
        EMBEDDER_BACKEND: cpu
    environment:
      SPOIN_DATABASE_URL: ${SPOIN_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/spoin_db_2}
      # ADR-0088: `the_spoin_universe` is a SEPARATE database, and this is a
      # separate variable on purpose -- frog will not fall back to
      # SPOIN_DATABASE_URL, because a convenience fallback is how a corpus
      # migration lands on spoin_db_2.
      SPOIN_UNIVERSE_DATABASE_URL: ${SPOIN_UNIVERSE_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe}

      SPOIN_ENV: local
      SPOIN_CORS_ORIGINS: http://localhost:3000
      SPOIN_JWT_SECRET_KEY: dev-secret-not-for-prod
      # ADR-0097: one embedder everywhere. Spelled out here because compose injects
      # only the variables this file names -- task 0039 is the bug where `.env` set
      # SPOIN_EMBEDDER and nothing read it, so every vector in production was a
      # meaningless hash vector and nothing raised.
      SPOIN_EMBEDDER: ${SPOIN_EMBEDDER:-qwen3}
      SPOIN_EMBEDDING_MODEL: ${SPOIN_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}

      # From the root .env (docker compose auto-loads it for ${...} substitution
      # in this file -- it does NOT inject the whole file into containers on its
      # own, only vars explicitly referenced here, which is why this and the
      # `worker` service below need it spelled out even though `.env` already
      # has it). Defaults to `fake` so a fresh clone with no `.env` still meets
      # the "docker compose up, no API key needed" promise. The API needs the
      # real generator too, not just the worker -- `request_topic`'s
      # `validate_topic_names`/`match_and_create_topics` calls run inline in
      # the request, before any GenerationJob exists for the worker to pick up.
      SPOIN_GENERATOR: ${SPOIN_GENERATOR:-fake}
      SPOIN_GEMINI_API_KEYS: ${SPOIN_GEMINI_API_KEYS:-}
      # Read only by spoin.probes.mistral_probe (docs/mistral-saga/). Empty
      # until provider validation runs; no production code reads it.
      SPOIN_MISTRAL_API_KEYS: ${SPOIN_MISTRAL_API_KEYS:-}
      SPOIN_GEMINI_THINKING_LADDER: ${SPOIN_GEMINI_THINKING_LADDER:-gemini-3.8-flash:20:5,gemini-3.7-flash:20:5,gemini-3.6-flash:20:5,gemini-3.5-flash:20:5,gemini-3-flash-preview:20:5}
      SPOIN_GEMINI_GENERATOR_LADDER: ${SPOIN_GEMINI_GENERATOR_LADDER:-gemini-3.5-flash-lite:500:15,gemini-3.1-flash-lite:500:15}
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/src
      # Same staleness reasoning as ./apps/api/src above, for the sibling
      # package (ADR-0087).
      - ./apps/frog/src:/app/frog/src
      # Mounted so `make lint` / `make types` see the working tree rather than
      # whatever was baked into the image at build time.
      - ./apps/api/tests:/app/tests
      # Same staleness trap, and a worse one because it fails QUIETLY: without
      # this, `alembic heads` run here answers from the revisions baked in at
      # the last build, so a migration added since reads as absent and an old
      # revision reads as head. Confirmed the hard way -- a new migration was
      # parented onto a stale head and created a second one.
      - ./apps/api/alembic:/app/alembic
      # And so do their *settings*. src/ and tests/ were mounted but
      # pyproject.toml was not, so ruff and mypy read the config baked in at
      # the last `docker compose build` -- editing a per-file-ignore or a
      # banned-api rule appeared to do nothing, and the stale rule kept firing
      # with its old message. Read-only: nothing in the container writes it.
      - ./apps/api/pyproject.toml:/app/pyproject.toml:ro
      # frog's own lint/type/test config and suite, mounted for the same
      # staleness reason as apps/api's (ADR-0087 put `make check` over both).
      - ./apps/frog/tests:/app/frog/tests
      - ./apps/frog/pyproject.toml:/app/frog/pyproject.toml:ro
      # The same ~1.2GB of Qwen3 weights the `frog` service caches. One model, one
      # download; the volume is separate from db-data and always has been.
      - frog-model-cache:/cache/huggingface
    command:
      ["uvicorn", "spoin.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ./apps/web
    environment:
      # The browser resolves this, not the container, so it is localhost either way.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Empty by default -- renders a disabled Google button rather than a
      # broken one. Set to match SPOIN_GOOGLE_CLIENT_ID above.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${SPOIN_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    command: ["npm", "run", "dev"]

  # CockroachDB spike harness (task 0016, ADR-0048). Opt-in only:
  #     docker compose --profile crdb up -d crdb
  # It does NOT start with a plain `docker compose up` -- Postgres (`db`) stays
  # the working local database for the whole spike (CLAUDE.md; task 0016 step 1).
  # Its own volume, never shared with `db`. Version pinned to what CockroachDB
  # Basic actually serves today (v26.2, the latest Regular release -- Basic does
  # not run Innovation releases), not `:latest`, so the spike can't validate a
  # feature the cloud tier can't use. DB Console: http://localhost:8080.
  crdb:
    profiles: ["crdb"]
    image: cockroachdb/cockroach:latest-v26.2
    command: ["start-single-node", "--insecure"]
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - crdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Its own database, because the test fixtures drop and recreate every table.
  # Sharing `spoin_db` would silently wipe it every time anyone ran the suite
  # -- and `spoin_db` is the one dev database this project keeps (see the
  # note at the top of this file), so that's never acceptable, not even for
  # tests.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # The suite runs the real embedder rather than a stand-in: task 0039 is what
        # happens when the thing under test is not the thing that runs.
        EMBEDDER_BACKEND: cpu
    environment:
      SPOIN_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db
      SPOIN_TEST_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/spoin_db_test
      # frog ingestion idempotency is a claim about the DATABASE - source_path UNIQUE,
      # chunk ondelete=CASCADE - so it is tested against a real one. Its own database,
      # never SPOIN_UNIVERSE_DATABASE_URL: the fixture drops and recreates every table
      # it points at, and frog/tests/conftest.py hard-errors on a name not ending _test.
      SPOIN_UNIVERSE_TEST_DATABASE_URL: postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe_test
      # ADR-0097: one embedder everywhere. Spelled out here because compose injects
      # only the variables this file names -- task 0039 is the bug where `.env` set
      # SPOIN_EMBEDDER and nothing read it, so every vector in production was a
      # meaningless hash vector and nothing raised.
      SPOIN_EMBEDDER: ${SPOIN_EMBEDDER:-qwen3}
      SPOIN_EMBEDDING_MODEL: ${SPOIN_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
      # Same staleness reasoning as ./apps/api/src above, for the sibling
      # package (ADR-0087).
      - ./apps/frog/src:/app/frog/src
      - ./apps/api/tests:/app/tests
      # pytest reads [tool.pytest.ini_options] from here -- same staleness
      # trap as the api service above.
      - ./apps/api/pyproject.toml:/app/pyproject.toml:ro
      # frog's own lint/type/test config and suite, mounted for the same
      # staleness reason as apps/api's (ADR-0087 put `make check` over both).
      - ./apps/frog/tests:/app/frog/tests
      - ./apps/frog/pyproject.toml:/app/frog/pyproject.toml:ro
      # The canon documents, for the drift guard in generation/prompts/canon.py: the
      # pinned preambles are CONDENSED from these files, so the test recomputes their
      # hashes and fails when the authoring track revises one. Read-only, and the api
      # image does not carry the corpus -- only this mount makes it reachable, and the
      # guard raises rather than passing quietly when it is absent.
      - ./docs/the_spoin_universe:/app/docs/the_spoin_universe:ro
      # Without this the suite re-downloads 1.2GB of weights on every `make test`.
      - frog-model-cache:/cache/huggingface
    entrypoint: ["sh", "-c"]
    command:
      - |
        python - <<'PY'
        import asyncio, asyncpg
        async def main():
            conn = await asyncpg.connect("postgresql://spoin:spoin@db:5432/spoin_db")
            for name in ("spoin_db_test", "the_spoin_universe_test"):
                try:
                    await conn.execute(f"CREATE DATABASE {name}")
                except asyncpg.DuplicateDatabaseError:
                    pass
            await conn.close()
            # pgvector, for the chunk embeddings frog writes.
            conn = await asyncpg.connect("postgresql://spoin:spoin@db:5432/the_spoin_universe_test")
            await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
            await conn.close()
        asyncio.run(main())
        PY
        # ADR-0087: frog's suite runs in the same pass so `make check` covers
        # both packages. It needs no database at all -- these are unit tests of
        # the embedder -- so it runs first and fails fast.
        pytest -q --rootdir /app/frog -c /app/frog/pyproject.toml /app/frog/tests
        pytest -q "$@"

  # Always-on here (local dev only) so a topic typed into the app actually
  # gets generated -- `--watch` polls for pending GenerationJob rows every
  # `SPOIN_WORKER_POLL_SECONDS` instead of the single cron pass production
  # uses (ADR-0003 §3: at free-tier quota a persistent pool has nothing to do
  # 99% of the time in PRODUCTION, which is not the same constraint as "does
  # a developer want to wait or manually rerun a one-shot command locally").
  # For the cron-shaped single pass this mirrors:
  #     docker compose run --rm worker python -m spoin.worker
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Generation embeds in bulk -- every grounding query, every card written. This
        # is the one service with the GPU on the api image (ADR-0094 keeps generation
        # local), so it is the one that gets the CUDA wheel.
        EMBEDDER_BACKEND: gpu
    environment:
      SPOIN_DATABASE_URL: ${SPOIN_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/spoin_db_2}
      # ADR-0088: `the_spoin_universe` is a SEPARATE database, and this is a
      # separate variable on purpose -- frog will not fall back to
      # SPOIN_DATABASE_URL, because a convenience fallback is how a corpus
      # migration lands on spoin_db_2.
      SPOIN_UNIVERSE_DATABASE_URL: ${SPOIN_UNIVERSE_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe}

      # See the `api` service's identical two lines above for why this reads
      # from `.env` via `${...}` instead of a literal -- same reasoning here.
      SPOIN_GENERATOR: ${SPOIN_GENERATOR:-fake}
      SPOIN_GEMINI_API_KEYS: ${SPOIN_GEMINI_API_KEYS:-}
      # Read only by spoin.probes.mistral_probe (docs/mistral-saga/). Empty
      # until provider validation runs; no production code reads it.
      SPOIN_MISTRAL_API_KEYS: ${SPOIN_MISTRAL_API_KEYS:-}
      # ADR-0097: one embedder everywhere. Spelled out here because compose injects
      # only the variables this file names -- task 0039 is the bug where `.env` set
      # SPOIN_EMBEDDER and nothing read it, so every vector in production was a
      # meaningless hash vector and nothing raised.
      SPOIN_EMBEDDER: ${SPOIN_EMBEDDER:-qwen3}
      SPOIN_EMBEDDING_MODEL: ${SPOIN_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/src
      # Same staleness reasoning as ./apps/api/src above, for the sibling
      # package (ADR-0087).
      - ./apps/frog/src:/app/frog/src
      - frog-model-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["python", "-m", "spoin.worker", "--watch"]

  # ADR-0088: migrations for `the_spoin_universe`, the source-of-truth corpus
  # database. Its own service because it runs frog's alembic environment, which
  # reads SPOIN_UNIVERSE_DATABASE_URL and DELIBERATELY nothing else -- a corpus
  # migration structurally cannot land on spoin_db_2.
  #
  # Profile-gated so it never runs as part of a plain `docker compose up`.
  # Creating the database is non-destructive, but CLAUDE.md's rules about the
  # `db` service are unchanged and now cover three databases sharing one volume:
  # spoin_db_2, spoin_db_test, and this one. `docker compose down -v`,
  # `make clean` and `docker volume rm` remain prohibited.
  #
  #     docker compose --profile universe run --rm universe-seed
  universe-seed:
    profiles: ["universe"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app/frog
    environment:
      SPOIN_UNIVERSE_DATABASE_URL: ${SPOIN_UNIVERSE_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/frog/src:/app/frog/src
      # Mounted so an autogenerated universe migration is written to the host
      # rather than into a container that is then thrown away -- and so that
      # `alembic heads` answers from the working tree, not from whatever was
      # baked in at the last build. The api service's identical mount exists
      # because that second failure mode already bit this project once.
      - ./apps/frog/alembic:/app/frog/alembic
    # CREATE DATABASE cannot run inside a transaction, and alembic will not
    # create its own target -- so the database is ensured first, idempotently,
    # then migrated. Mirrors how the `test` service ensures spoin_db_test.
    entrypoint: ["sh", "-c"]
    command:
      - |
        python - <<'PY'
        import asyncio, asyncpg
        async def main():
            conn = await asyncpg.connect("postgresql://spoin:spoin@db:5432/postgres")
            try:
                await conn.execute("CREATE DATABASE the_spoin_universe")
                print("created the_spoin_universe")
            except asyncpg.DuplicateDatabaseError:
                print("the_spoin_universe already exists")
            await conn.close()
            conn = await asyncpg.connect("postgresql://spoin:spoin@db:5432/the_spoin_universe")
            await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
            await conn.close()
        asyncio.run(main())
        PY
        alembic upgrade head

  # Task 0038, Phase 2: corpus ingestion. The ONLY service with a GPU, and the only
  # one built from apps/frog/Dockerfile -- ADR-0092 put bulk embedding on the owner's
  # machine (RTX 5070) because only the app backend deploys, so torch lives here
  # rather than in the api image every other service builds from.
  #
  # Profile-gated: ingestion is a deliberate command, never part of `docker compose up`.
  #
  #     docker compose --profile frog run --rm frog --check   # validate, no GPU needed
  #     docker compose --profile frog run --rm frog           # ingest
  #
  # `--check` runs the contract validator alone. It loads no model and opens no
  # database, so it works on a machine with no GPU at all -- which is what the
  # corpus-authoring track needs from this service.
  frog:
    profiles: ["frog"]
    build:
      context: .
      dockerfile: apps/frog/Dockerfile
    environment:
      SPOIN_UNIVERSE_DATABASE_URL: ${SPOIN_UNIVERSE_DATABASE_URL:-postgresql+asyncpg://spoin:spoin@db:5432/the_spoin_universe}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Same staleness reasoning as the api service's src mount (ADR-0087).
      - ./apps/frog/src:/app/frog/src
      # The corpus, read-only. Authored continuously by another track, so it is mounted
      # rather than baked in -- an image rebuild per delivery would be absurd, and a
      # read-only mount makes it structurally impossible for the ingester to edit the
      # material it is reading.
      - ./docs/the_spoin_universe:/repo/docs/the_spoin_universe:ro
      # ~1.2GB of model weights, kept across `--rm` runs.
      - frog-model-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  db-data:
  web-node-modules:
  crdb-data:
  # Deliberately NOT db-data. Model weights are re-downloadable and this volume is
  # genuinely disposable -- which is exactly what db-data is not, and keeping them
  # separate means nobody ever reasons about clearing a cache and reaches for the
  # volume holding three databases (CLAUDE.md).
  frog-model-cache:
